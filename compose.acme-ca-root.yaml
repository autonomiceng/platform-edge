# Selected by bootstrap when PE_ACME_CA_ROOT is set: the private ACME server's trust file.
services:
  caddy:
    environment:
      PE_ACME_TRUST: file
    volumes:
      - type: bind
        source: ${PE_ACME_CA_ROOT:?PE_ACME_CA_ROOT must be the ACME server's CA file}
        target: /certs/acme-ca-root.crt
        read_only: true
        bind:
          create_host_path: false
