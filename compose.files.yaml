# Selected by bootstrap for PE_TLS_ISSUER=files: operator certificate files, never created by Docker.
services:
  caddy:
    volumes:
      - type: bind
        source: ${PE_TLS_DIR:?PE_TLS_DIR must hold tls.crt and tls.key}
        target: /certs
        read_only: true
        bind:
          create_host_path: false
