# One shared ingress per host (ADR-0001). Only Caddy publishes ports.
# The validated default is pinned as tag plus digest; Renovate raises bumps, humans merge them.
name: platform-edge

x-logging: &logging
  driver: journald
  options:
    cache-disabled: "true"

services:
  caddy:
    image: ${PE_CADDY_IMAGE:-caddy:2.11.4@sha256:13ba145cba2f3e28fa801994876e4c086d1b95d5aa2a520a734765ffb6b12017}
    restart: unless-stopped
    mem_limit: 256m
    mem_reservation: 64m
    pids_limit: 256
    cpus: 1
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    cap_add: [NET_BIND_SERVICE]
    read_only: true
    tmpfs:
      - /tmp
    logging: *logging
    ports:
      - "${PE_BIND_HOST:-127.0.0.1}:${PE_HTTP_PORT:-80}:80"
      - "${PE_BIND_HOST:-127.0.0.1}:${PE_HTTPS_PORT:-443}:443"
    environment:
      PE_ACCESS_MODE: ${PE_ACCESS_MODE:-local}
      PE_PUBLIC_DOMAIN: ${PE_PUBLIC_DOMAIN:-localhost}
      PE_SCHEME: ${PE_SCHEME:-http}
      PE_ACME_EMAIL: ${PE_ACME_EMAIL:-}
      PE_TAILSCALE_HOST: ${PE_TAILSCALE_HOST:-}
      PE_TAILSCALE_APPS: ${PE_TAILSCALE_APPS:-}
      PE_TAILSCALE_PORT: ${PE_TAILSCALE_PORT:-443}
      PE_TAILSCALE_LITELLM_PORT: ${PE_TAILSCALE_LITELLM_PORT:-8443}
      PE_TAILSCALE_LANGFUSE_PORT: ${PE_TAILSCALE_LANGFUSE_PORT:-8444}
      PE_TAILSCALE_S3_PORT: ${PE_TAILSCALE_S3_PORT:-8445}
      PE_TAILSCALE_GATEWAY_PORT: ${PE_TAILSCALE_GATEWAY_PORT:-8446}
      PE_TAILSCALE_GRAFANA_PORT: ${PE_TAILSCALE_GRAFANA_PORT:-8447}
      PE_TAILSCALE_BACKPLANE_PORT: ${PE_TAILSCALE_BACKPLANE_PORT:-8448}
      PE_TAILSCALE_RUSTFS_PORT: ${PE_TAILSCALE_RUSTFS_PORT:-8449}
      PE_TAILSCALE_BACKPLANE_RUSTFS_PORT: ${PE_TAILSCALE_BACKPLANE_RUSTFS_PORT:-8450}
      PE_TAILSCALE_OBSERVABILITY_RUSTFS_PORT: ${PE_TAILSCALE_OBSERVABILITY_RUSTFS_PORT:-8451}
      PE_TRUSTED_PROXIES: ${PE_TRUSTED_PROXIES:-}
      PE_METRICS_ALLOW: ${PE_METRICS_ALLOW:-127.0.0.0/8 ::1}
    volumes:
      - edge-data:/data
      - edge-config:/config
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ./routes.d:/etc/caddy/routes.d:ro
      - ./docker/console:/srv/console:ro
      - ./data/console:/srv/state:ro
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/health"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    networks:
      platform:
        aliases: [pe-edge]

volumes:
  edge-data:
    external: true
    name: ${PE_VOLUME_PREFIX:-platform-edge}_edge-data
  edge-config:
    external: true
    name: ${PE_VOLUME_PREFIX:-platform-edge}_edge-config

networks:
  platform:
    name: ${PE_PLATFORM_NETWORK:-platform}
    external: true
