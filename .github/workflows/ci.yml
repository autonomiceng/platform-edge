name: CI

on:
  workflow_dispatch:
  push:
    branches: [main, develop]
  pull_request:
  schedule:
    # Weekly full boot of the pinned images so rot is caught between merges.
    - cron: "17 9 * * 1"

permissions:
  contents: read

jobs:
  validate:
    name: Validate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - uses: jdx/mise-action@5228313ee0372e111a38da051671ca30fc5a96db # v3.6.3
      - run: scripts/validate.sh
      - name: Bootstrap dry-run from the template
        run: |
          python3 scripts/bootstrap.py --env-file "$RUNNER_TEMP/edge-dry-run.env" --dry-run
          test ! -e "$RUNNER_TEMP/edge-dry-run.env"
      - run: python3 -m unittest discover -s tests -v
      - name: Status contract checks
        run: node --test tests/status*.test.cjs
      - name: Install browser test tools
        run: |
          npm ci
          node node_modules/playwright/cli.js install --with-deps chromium
      - name: Console browser checks
        run: node tests/console-browser.cjs

  smoke:
    name: Smoke contract
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - uses: jdx/mise-action@5228313ee0372e111a38da051671ca30fc5a96db # v3.6.3
      - run: scripts/smoke.sh
      - run: scripts/backup-drill.sh
