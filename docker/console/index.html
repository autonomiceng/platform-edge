<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <meta name="color-scheme" content="dark" />
    <title>Platform Edge</title>
    <link rel="icon" href="/console/icons/edge.svg" />
    <link rel="stylesheet" href="/console/style.css" />
  </head>
  <body>
    <header>
      <a class="brand" href="/"
        ><img class="logo" src="/console/icons/edge.svg" alt="" /><span

          >Platform Edge</span
        ><span class="pill" id="access-mode"></span

    <main id="app"></main>
    <div id="toast" role="status"></div>
    <noscript>Enable JavaScript to view application links and health.</noscript>
    <script type="application/json" id="edge-config">
      {{include "config.json"}}
    </script>
    <script src="/console/catalog.js"></script>
    <script src="/console/app.js"></script>
  </body>
</html>
