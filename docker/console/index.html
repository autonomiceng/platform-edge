<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <meta name="color-scheme" content="dark light" />
    <title>Platform Edge</title>
    <link rel="icon" href="/console/icons/edge.svg" />
    <link rel="stylesheet" href="/console/platform.css" />
    <link rel="stylesheet" href="/console/style.css" />
  </head>
  <body class="pk-page">
    <header class="pk-header">
      <a class="pk-brand" href="/"><img src="/console/icons/edge.svg" alt="" />Platform Edge</a>
      <span class="pk-pill" id="access-mode"></span>
      <div class="pk-header-links"><span id="host-name"></span></div>
    </header>
    <main>
      <div class="toolbar">
        <h1>Applications</h1>
        <span id="summary" class="summary"></span>
        <span id="checked" class="checked" role="status" aria-live="polite"></span>
        <button class="pk-button" id="refresh" type="button">Refresh</button>
      </div>
      <p class="pk-notice" id="notice" data-state="warn" hidden></p>
      <div id="projects" class="projects"></div>
      <noscript><p class="pk-notice">Enable JavaScript to view application links and health.</p></noscript>
    </main>
    <dialog class="pk-drawer" id="drawer" aria-labelledby="drawer-title"></dialog>
    <p class="pk-sr-only" id="announce" role="status" aria-live="polite"></p>
    <script type="application/json" id="edge-config">
      {{include "config.json"}}
    </script>
    <script src="/console/catalog.js"></script>
    <script src="/console/status.js"></script>
    <script src="/console/app.js"></script>
  </body>
</html>
